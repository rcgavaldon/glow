<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holiday Glow Lamps</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#fbf8f2;--ink:#222;--muted:#6b6b6b;--gold:#b8892d;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#eee;--muted:#aaa;--card:#1f1f1f}}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  main{max-width:720px;margin:0 auto;padding:32px 16px 48px;text-align:center}
  h1{font-size:28px;margin:0 0 4px} .gold{color:var(--gold)}
  .code{color:var(--muted);font-size:14px;letter-spacing:.08em;margin-bottom:24px}
  .card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
  .vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
  .vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .msg{font-family:Georgia,serif;font-size:21px;line-height:1.4;margin:4px 0 18px;white-space:pre-line}
  .flame{font-size:54px;line-height:1;margin:6px 0 10px}
  a.btn{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none}
  footer{margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>✨ Holiday <span class="gold">Glow</span> Lamps ✨</h1>
  <div class="code" id="code"></div>
  <div class="card" id="box"><p>Loading…</p></div>
  <footer>Made by the Da Vinci Chess Club · 3D printed just for you</footer>
</main>
<script>
const raw=(location.hash.slice(1)||location.search.slice(1).split('&')[0]).toUpperCase().replace(/[^A-Z0-9]/g,'');
const code=raw, box=document.getElementById('box');
const valid=/^G\d{3}([A-Z0-9]{5})?$/.test(code);
document.getElementById('code').textContent=valid?('ORDER '+(code.length>4?code.slice(0,4)+'-'+code.slice(4):code)):'';
const enc=new TextEncoder(), hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(c){const base=await crypto.subtle.importKey('raw',enc.encode(c),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('glow-lamps-v1'),iterations:200000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);}
const dec=(k,iv,ct)=>crypto.subtle.decrypt({name:'AES-GCM',iv},k,ct);
function embed(url){
  let m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);
  if(m) return `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
  m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return `<div class="vid"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay" allowfullscreen></iframe></div>`;
  return `<div class="vid"><video src="${url}" controls playsinline></video></div>`;
}
const pending='<div class="flame">🕯️</div><p><b>Your print is being made!</b></p><p style="color:var(--muted)">The video of your print being made will show up right here soon. Check back in a few days.</p>';
(async()=>{
  if(!valid){box.innerHTML='<p>Scan the code on the bottom of your print to see it being printed.</p>';return;}
  const id=hex(await crypto.subtle.digest('SHA-256',enc.encode('glow-id:'+code))).slice(0,32);
  const r=await fetch('data/'+id+'.json?'+Date.now());
  if(!r.ok){box.innerHTML=pending;return;}
  const d=await r.json(), k=await keyFor(code);
  const o=JSON.parse(new TextDecoder().decode(await dec(k,unb64(d.iv),unb64(d.ct))));
  let html=o.message?'<div class="msg"></div>':'';
  if(o.video){
    let src=o.video;
    if(o.kind==='enc'){box.innerHTML=html+'<p>Loading your video…</p>'; if(o.message) box.querySelector('.msg').textContent='“'+o.message+'”';
      const ct=await (await fetch(o.video)).arrayBuffer(); src=URL.createObjectURL(new Blob([await dec(k,unb64(o.viv),ct)],{type:'video/mp4'}));}
    html+='<p><b>Watch your print being made!</b></p>'+embed(src)+'<p style="color:var(--muted);font-size:14px;margin-top:12px">Every layer of your print, start to finish.</p>';
  } else html+=pending;
  box.innerHTML=html; if(o.message) box.querySelector('.msg').textContent='“'+o.message+'”';
})().catch(()=>{box.innerHTML='<p>Couldn’t load right now — try again in a minute.</p>';});
</script>
</body>
</html>
