<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Holiday Glow Lamps</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#fbf8f2;--ink:#222;--muted:#6b6b6b;--gold:#b8892d;--card:#fff}
  @media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#eee;--muted:#aaa;--card:#1f1f1f}}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
  main{max-width:720px;margin:0 auto;padding:32px 16px 48px;text-align:center}
  h1{font-size:28px;margin:0 0 4px} .gold{color:var(--gold)}
  .code{color:var(--muted);font-size:14px;letter-spacing:.08em;margin-bottom:24px}
  .card{background:var(--card);border-radius:14px;padding:22px;box-shadow:0 2px 14px rgba(0,0,0,.08)}
  .vid{position:relative;padding-top:56.25%;border-radius:10px;overflow:hidden;background:#000}
  .vid iframe,.vid video{position:absolute;inset:0;width:100%;height:100%;border:0}
  .flame{font-size:54px;line-height:1;margin:6px 0 10px}
  a.btn{display:inline-block;margin-top:14px;padding:10px 18px;border-radius:999px;background:var(--gold);color:#fff;text-decoration:none}
  footer{margin-top:28px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<main>
  <h1>✨ Holiday <span class="gold">Glow</span> Lamps ✨</h1>
  <div class="code" id="code"></div>
  <div class="card" id="box"><p>Loading…</p></div>
  <footer>Made by the Da Vinci Chess Club · 3D printed just for you</footer>
</main>
<script>
const code=(location.search.slice(1).split('&')[0]||location.hash.slice(1)).toUpperCase().replace(/[^A-Z0-9]/g,'');
const box=document.getElementById('box');
document.getElementById('code').textContent=code?('ORDER '+code):'';
function embed(url){
  let m=url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{6,})/);
  if(m) return `<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}?rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`;
  m=url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if(m) return `<div class="vid"><iframe src="https://drive.google.com/file/d/${m[1]}/preview" allow="autoplay" allowfullscreen></iframe></div>`;
  if(/\.(mp4|webm|mov)(\?|$)/i.test(url)) return `<div class="vid"><video src="${url}" controls playsinline></video></div>`;
  return `<a class="btn" href="${url}">Watch your lamp being made</a>`;
}
fetch('orders.json?'+Date.now()).then(r=>r.json()).then(d=>{
  const o=code&&(d[code]||(/^G\d{3}$/.test(code)?{video:''}:null));
  if(!code||!o){box.innerHTML='<p>Scan the code on the bottom of your lamp to see it being printed.</p>';return;}
  if(o.video){box.innerHTML='<p><b>Watch your lamp being made!</b></p>'+embed(o.video)+'<p style="color:var(--muted);font-size:14px;margin-top:12px">Every layer of your lamp, start to finish.</p>';}
  else{box.innerHTML='<div class="flame">🕯️</div><p><b>Your lamp is being made!</b></p><p style="color:var(--muted)">The video of your lamp printing will show up right here soon. Check back in a few days.</p>';}
}).catch(()=>{box.innerHTML='<p>Couldn’t load right now — try again in a minute.</p>';});
</script>
</body>
</html>
