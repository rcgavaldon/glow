<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glow Lamp Hub</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#f6f3ee;--ink:#1f1f1f;--muted:#6b6b6b;--gold:#b07a1e;--card:#fff;--line:#e2dacb;--ok:#1e7a3c;--wait:#8a6200;--blue:#1d5fa8}
  @media (prefers-color-scheme:dark){:root{--bg:#121212;--ink:#eee;--muted:#a3a3a3;--card:#1e1e1e;--line:#333}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
  main{max-width:1100px;margin:0 auto;padding:16px}
  h1{font:700 24px Georgia,serif;color:var(--gold);margin:4px 0 12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .k b{display:block;font:700 24px Georgia,serif} .k span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px;align-items:center}
  .bar button,.f{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
  .f.on{background:var(--gold);color:#fff;border-color:var(--gold)}
  input#q{flex:1;min-width:180px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:14px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:rgba(176,122,30,.07)}
  .st{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .s-wait{background:#fff3cd;color:var(--wait)} .s-paid{background:#d9f2e1;color:var(--ok)} .s-pr{background:#dce9fb;color:var(--blue)} .s-del{background:#e6e6e6;color:#444}
  .tg{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer;margin:1px}
  .tg.on{background:var(--ok);color:#fff;border-color:var(--ok)}
  .mut{color:var(--muted);font-size:12px}
  .sellers{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:13px}
  .sellers span{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
  #login{max-width:360px;margin:60px auto;text-align:center} #login input{width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:16px;margin:8px 0}
  #login button{width:100%;padding:10px;border:0;border-radius:10px;background:var(--gold);color:#fff;font-size:16px}
  @media (max-width:700px){ .hide-sm{display:none} }
  @media print{ .bar,.kpis,.sellers,.tg,h1 small{display:none} body{background:#fff} }
</style>
</head>
<body>
<main>
  <div id="login" style="display:none"><h1>Glow Lamp Hub</h1><p class="mut">Enter your admin key (only needed once on this device).</p><input id="key" placeholder="Admin key"><button id="go">Open hub</button><p id="lerr" style="color:#b3261e"></p></div>
  <div id="app" style="display:none">
    <h1>Glow Lamp Hub <small class="mut" id="upd"></small></h1>
    <div class="bar"><button class="f on" id="tabO">Orders</button><button class="f" id="tabS">Sellers</button></div>
    <div id="ordersView">
    <div class="kpis" id="kpis"></div>
    <div class="sellers" id="sellers"></div>
    <div class="bar" id="filters"></div>
    <div class="bar" id="chan"></div>
    <div class="bar"><input id="q" placeholder="Search name, words, code, period…"><button id="refresh">↻ Refresh</button><button onclick="print()">Print list</button></div>
    <table><thead><tr><th>Order</th><th>For (deliver to)</th><th>Lamp</th><th class="hide-sm">Buyer / seller</th><th>Status</th><th>Mark</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
    <div id="sellersView" style="display:none">
      <div class="k" style="margin-bottom:10px"><b style="font-size:18px">Create a seller ID</b>
        <div class="bar"><input id="sname" placeholder="Student full name" style="flex:2;min-width:180px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
        <input id="semail" placeholder="email (optional)" style="flex:2;min-width:160px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink)">
        <button id="sadd" style="background:var(--gold);color:#fff;border-color:var(--gold)">Create ID</button></div>
        <div class="mut">Students open <b>rcgavaldon.github.io/glow/seller.html</b> and type their ID to see their sales and take orders.</div>
        <div id="serr" style="color:#b3261e;font-size:14px"></div></div>
      <table><thead><tr><th>Seller</th><th>ID</th><th>Lamps</th><th>Collected</th><th>Active</th></tr></thead><tbody id="srows"></tbody></table>
    </div>
  </div>
</main>
<script>
const API = 'https://script.google.com/macros/s/AKfycbwjGLyOPWmt-HEdDSuqC_hzxM0vHVcqmwDSRrwid8x1l4uEjVADZyMbafsvh7urklYM/exec';
const $=id=>document.getElementById(id); const esc=t=>String(t??'').replace(/&/g,'&amp;').replace(/</g,'&lt;');
let KEY=''; try{ KEY=localStorage.getItem('glowHubKey')||''; }catch(e){}
let orders=[], filt='all';
const FILTERS=[['all','All'],['wait','Waiting for payment'],['toprint','Paid — to print'],['todeliver','Printed — to deliver'],['done','Delivered']];
const stage=o=>o.Delivered?'done':o.Printed?'todeliver':o.Status==='PAID'?'toprint':'wait';
const LBL={wait:['Waiting for payment','s-wait'],toprint:['Paid — to print','s-paid'],todeliver:['Printed — to deliver','s-pr'],done:['Delivered','s-del']};
async function load(){
  const r=await fetch(API+'?'+new URLSearchParams({action:'list',key:KEY})); const j=await r.json();
  if(!j.ok){ try{localStorage.removeItem('glowHubKey')}catch(e){} showLogin(j.error); return; }
  orders=j.orders.filter(o=>o['Order #']).reverse(); $('login').style.display='none'; $('app').style.display='block'; $('upd').textContent='updated '+new Date().toLocaleTimeString(); render();
}
function showLogin(e){ $('app').style.display='none'; $('login').style.display='block'; $('lerr').textContent=e?('Key not accepted: '+e):''; }
let chan='all';
function render(){
  const paid=orders.filter(o=>o.Status==='PAID'); const money=a=>a.reduce((s,o)=>s+Number(o.Price||0),0);
  const c=k=>orders.filter(o=>stage(o)===k).length;
  $('kpis').innerHTML=[[orders.length,'Lamps ordered'],['$'+money(paid),'Collected'],['$'+money(orders.filter(o=>o.Status!=='PAID')),'Still owed'],[c('toprint'),'To print'],[c('todeliver'),'To deliver'],[c('done'),'Delivered']].map(([v,l])=>`<div class="k"><b>${v}</b><span>${l}</span></div>`).join('');
  const by={}; paid.forEach(o=>{ const s=o['Paid to']||'?'; by[s]=(by[s]||0)+Number(o.Price||0); });
  $('sellers').innerHTML=Object.entries(by).map(([s,v])=>`<span>${esc(s)}: <b>$${v}</b></span>`).join('');
  $('filters').innerHTML=FILTERS.map(([k,l])=>`<button class="f ${filt===k?'on':''}" data-f="${k}">${l} (${k==='all'?orders.length:c(k)})</button>`).join('');
  [...$('filters').children].forEach(b=>b.onclick=()=>{ filt=b.dataset.f; render(); });
  const q=$('q').value.toLowerCase();
  const isOut=o=>o.Channel==='Out of school';
  $('chan').innerHTML=[['all','All'],['in','In school'],['out','Out of school']].map(([k,l])=>`<button class="f ${chan===k?'on':''}" data-c="${k}">${l} (${k==='all'?orders.length:orders.filter(o=>k==='out'?isOut(o):!isOut(o)).length})</button>`).join('');
  [...$('chan').children].forEach(b=>b.onclick=()=>{ chan=b.dataset.c; render(); });
  const list=orders.filter(o=>(chan==='all'||(chan==='out')===isOut(o))&&(filt==='all'||stage(o)===filt)&&(!q||JSON.stringify(o).toLowerCase().includes(q)))
    .sort((a,b)=>filt==='todeliver'?(Number(a.Period)-Number(b.Period)):0);
  $('rows').innerHTML=list.map(o=>{ const st=LBL[stage(o)]; const w=[o['Line 1'],o['Line 2'],o['Line 3'],o['Line 4']].filter(x=>x).join(' / ');
    return `<tr><td><b>${esc(o['Order #'])}</b><div class="mut">cart ${esc(o.Cart)}</div></td>
      <td><b>${esc(o['Deliver to'])}</b><div class="mut">${o.Channel==='Out of school'?'<b style="color:#b07a1e">OUT OF SCHOOL</b> &bull; via '+esc(o['Seller link']||o['Paid to']||'')+(o.Contact?' &bull; '+esc(o.Contact):''):'grade '+esc(o.Grade)+' &bull; period '+esc(o.Period)+(o.Teacher?' &bull; '+esc(o.Teacher):'')}</div></td>
      <td>${esc(o.Design)} &bull; ${esc(o.Style)}${w?`<div><b>${esc(w)}</b></div>`:''}${o['Gift message']?`<div class="mut">“${esc(o['Gift message'])}”</div>`:''}</td>
      <td class="hide-sm">${esc(o['Buyer name'])}${o['Buyer email']?'<div class="mut">'+esc(o['Buyer email'])+'</div>':''}${o['Buyer 1st period']?'<div class="mut">1st per: '+esc(o['Buyer 1st period'])+'</div>':''}${o.Channel!=='Out of school'&&o.Contact?'<div class="mut">'+esc(o.Contact)+'</div>':''}<div class="mut">$${esc(o.Price)} ${o['Paid to']?'&bull; paid to '+esc(o['Paid to']):''}</div></td>
      <td><span class="st ${st[1]}">${st[0]}</span></td>
      <td>${o.Status!=='PAID'?`<button class="tg" data-c="${esc(o['Order #'])}" data-k="Paid">Mark paid</button>`:''}
          <button class="tg ${o.Printed?'on':''}" data-c="${esc(o['Order #'])}" data-k="Printed">Printed</button>
          <button class="tg ${o.Delivered?'on':''}" data-c="${esc(o['Order #'])}" data-k="Delivered">Delivered</button></td></tr>`; }).join('') || `<tr><td colspan="6" class="mut">No orders here yet.</td></tr>`;
  [...document.querySelectorAll('.tg')].forEach(b=>b.onclick=async()=>{ b.disabled=true; const on=!b.classList.contains('on');
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'admin',key:KEY,code:b.dataset.c,field:b.dataset.k,value:on})}); const j=await r.json();
    if(!j.ok) alert(j.error); await load(); });
}

// ---- sellers tab ----
async function sellers(body){ const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:'sellers',key:KEY},body||{}))}); return r.json(); }
function drawSellers(j){
  if(!j.ok){ $('serr').textContent=j.error; return; } $('serr').textContent='';
  $('srows').innerHTML=j.sellers.sort((a,b)=>b.money-a.money).map(s=>`<tr><td><b>${esc(s.name)}</b><div class="mut">${esc(s.email)}</div></td><td><code style="font-size:15px">${esc(s.code)}</code></td><td>${s.lamps}</td><td>$${s.money}</td>
    <td><button class="tg ${s.active?'on':''}" data-code="${esc(s.code)}" data-on="${s.active?1:0}">${s.active?'On':'Off'}</button></td></tr>`).join('');
  [...$('srows').querySelectorAll('.tg')].forEach(b=>b.onclick=async()=>{ b.disabled=true; drawSellers(await sellers({op:'active',code:b.dataset.code,value:b.dataset.on!=='1'})); });
}
$('tabO').onclick=()=>{ $('ordersView').style.display='block'; $('sellersView').style.display='none'; $('tabO').classList.add('on'); $('tabS').classList.remove('on'); };
$('tabS').onclick=async()=>{ $('ordersView').style.display='none'; $('sellersView').style.display='block'; $('tabS').classList.add('on'); $('tabO').classList.remove('on'); drawSellers(await sellers({})); };
$('sadd').onclick=async()=>{ const n=$('sname').value.trim(); if(!n){ $('serr').textContent='Type the student\'s name.'; return; } $('sadd').disabled=true;
  const j=await sellers({op:'add',name:n,email:$('semail').value.trim()}); $('sadd').disabled=false; if(j.ok){ $('sname').value=''; $('semail').value=''; } drawSellers(j); };

$('q').oninput=render; $('refresh').onclick=load;
$('go').onclick=()=>{ KEY=$('key').value.trim(); try{localStorage.setItem('glowHubKey',KEY)}catch(e){} load(); };
if(KEY) load().catch(e=>showLogin(e.message)); else showLogin();
setInterval(()=>{ if(KEY&&$('app').style.display==='block') load().catch(()=>{}); }, 60000);
</script>
</body>
</html>
